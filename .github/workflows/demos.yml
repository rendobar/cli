# Regenerate VHS demo recordings.
#
# Runs:  push to main, new v* tag, manual dispatch.
# Output: demos/out/*.{gif,mp4,webm} uploaded as artifact + attached
# to the GitHub Release on tags.

name: demos

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "demos/**"
      - ".github/workflows/demos.yml"
  workflow_dispatch:

permissions:
  contents: write   # release asset upload

jobs:
  render:
    name: render demos
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/charmbracelet/vhs:v0.11.0@sha256:9d5fc3dc0c160b0fb1d2212baff07e6bdf3fa9438c504a3237484567302fcf93
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Render hero
        working-directory: ${{ github.workspace }}
        run: |
          chmod +x demos/bin/rb
          mkdir -p demos/out
          export PATH="$PWD/demos/bin:$PATH"
          vhs demos/hero.tape
          ls -lh demos/out/

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: demos-${{ github.sha }}
          path: demos/out/
          retention-days: 30

      - name: Bundle for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd demos/out
          zip -r ../../demos.zip .

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          files: demos.zip

      - name: Drift check (main branch)
        if: github.ref == 'refs/heads/main'
        run: |
          # Demos source the real CLI's progress format. If the stub
          # diverges from src/lib/progress.ts the GIFs lie. Soft-warn.
          if ! grep -q '⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏' demos/bin/rb; then
            echo "::warning::demos/bin/rb spinner frames may have drifted from src/lib/progress.ts"
          fi
