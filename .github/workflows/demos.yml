# Regenerate VHS demo recordings.
#
# Runs:  push to main, new v* tag, manual dispatch.
# Output: demos/out/*.{gif,mp4,webm} uploaded as artifact + attached
# to the GitHub Release on tags.

name: demos

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "demos/**"
      - ".github/workflows/demos.yml"
  workflow_dispatch:

permissions:
  contents: write   # release asset upload

jobs:
  render:
    name: render demos
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/charmbracelet/vhs:v0.11.0@sha256:9d5fc3dc0c160b0fb1d2212baff07e6bdf3fa9438c504a3237484567302fcf93
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Render hero
        working-directory: ${{ github.workspace }}
        run: |
          chmod +x demos/bin/rb
          mkdir -p demos/out
          export PATH="$PWD/demos/bin:$PATH"
          vhs demos/hero.tape
          ls -lh demos/out/

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: demos-${{ github.sha }}
          path: demos/out/
          retention-days: 30

      # Attach the rendered media straight to the release. The vhs container
      # (debian:stable-slim) ships no `zip`, and bundling 3 files into an
      # archive nobody can preview adds no value -- hero.gif renders inline on
      # the release page, the mp4/webm download as-is.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: |
            demos/out/hero.gif
            demos/out/hero.mp4
            demos/out/hero.webm

      - name: Drift check (main branch)
        if: github.ref == 'refs/heads/main'
        run: |
          # Demos source the real CLI's progress format. If the stub
          # diverges from src/lib/progress.ts the GIFs lie. Soft-warn.
          if ! grep -q '⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏' demos/bin/rb; then
            echo "::warning::demos/bin/rb spinner frames may have drifted from src/lib/progress.ts"
          fi
